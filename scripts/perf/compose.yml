# Disposable benchmark infrastructure. No published host ports, no private config.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: benchmark-local-only
      MYSQL_DATABASE: msgmate_perf_test
    volumes:
      - ../../sql/msgcenter.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 -uroot --silent']
      interval: 2s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7.2.14-alpine
    command: [redis-server, --requirepass, benchmark-local-only]
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  runtime:
    image: alpine:3.22
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ${PERF_WORK}:/perf
    command: [/perf/msgmate-perf, -config-file, /perf/config.toml]
  load:
    image: alpine:3.22
    environment:
      LUA_PATH: /perf/lib/?.lua;;
    volumes:
      - ${PERF_WORK}:/perf
    command: [sleep, infinity]
